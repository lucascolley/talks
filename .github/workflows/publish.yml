name: Quarto Publish

on:
  push:
    branches:
      - main
      - renovate/**
  pull_request:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Quarto
        # yamllint disable-line rule:line-length
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2

      - name: Render Quarto talks
        # yamllint disable-line rule:line-length
        uses: quarto-dev/quarto-actions/render@8a96df13519ee81fd526f2dfca5962811136661b # v2

      - name: Set up Pixi
        # yamllint disable-line rule:line-length
        uses: prefix-dev/setup-pixi@ad1da6449d9e506fd127fd67ab2d054a769f6a94 # v0.11.2
        with:
          cache: true

      # Slidev decks go into Quarto's output, served at /talks/<slug>/
      - name: Build Slidev talks
        run: pixi run build --base /talks/ --out _site
        env:
          # Chromium is only needed for PDF export, not for building the site
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Publish main branch
        if: github.ref == 'refs/heads/main'
        # yamllint disable-line rule:line-length
        uses: quarto-dev/quarto-actions/publish@8a96df13519ee81fd526f2dfca5962811136661b # v2
        with:
          target: gh-pages
          # Re-rendering would wipe the Slidev decks from _site
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
